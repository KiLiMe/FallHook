[InGameTextHook]
; Enable=1                          ; Live translate $Key UI text (Pip-Boy, menus, etc.) / 实时翻译游戏 UI 文本
; LogRaw=1                          ; Log raw key-value pairs for building InGameText.txt / 日志原始键值对

[XML]
; plugin   = sort by plugin load order (default) / 按插件加载顺序排序
; filename = sort by filename ascending / 按文件名升序排序
LoadOrderMode = plugin

[Watchdog]
; Enable=1                          ; Warn on slow/stuck hooks / 加载或 Hook 卡顿时发出警告
Enable = false

[ActivityWatchdog]
; Enable=1                          ; Aggressive hook/work activity logging / 详细的 Hook 活动日志（非常冗长）
Enable = false
LogBegin = true                     ; Log when each work scope begins / 记录每个工作开始
LogEnd = true                       ; Log when each work scope ends / 记录每个工作结束
LogFastCalls = true                 ; Also log calls that complete quickly / 也记录快速完成的调用
SlowUs = 500                        ; Threshold in microseconds for "slow" / "慢"调用的阈值（微秒）
BurstWindowMs = 250                 ; Time window for burst detection / 突发检测的时间窗口（毫秒）
BurstCallWarn = 128                 ; Calls per burst window to trigger warning / 每个窗口触发警告的调用数
IncludeWorkScopes = true            ; Include named work scopes in logs / 在日志中包含命名工作范围
IncludeThreadDepth = true           ; Include thread depth in logs / 在日志中包含线程深度

[Logging]
EnableDebugLog = false              ; Enable debug-level logging / 启用调试级别日志
EnableDebugInfo = false             ; Enable verbose info messages / 启用详细信息消息
EnableXMLLoadOrderLog = false       ; Log XML load order resolution / 记录 XML 加载顺序解析

[Debug]
; TestAll=1                         ; DEBUG: replace all text with "樊" / 测试用：将所有文本替换为"樊"字