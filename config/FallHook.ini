[InGameTextHook]
Enable = false
LogRaw = false

[XML]
; plugin = use active plugin order, then filename descending for files from the same addon.
; filename = global filename ascending order. Later files overwrite earlier files for the same resolved record slot.
LoadOrderMode = plugin

[Watchdog]
; Enables load-watch and hook-watch slow/stuck warnings independently of debug trace logging.
Enable = false

[ActivityWatchdog]
; Aggressive FallHook hook/work activity logging for stutter attribution. Very noisy when enabled.
Enable = false
LogBegin = true
LogEnd = true
LogFastCalls = true
SlowUs = 500
BurstWindowMs = 250
BurstCallWarn = 128
IncludeWorkScopes = true
IncludeThreadDepth = true

[Logging]
EnableDebugLog = false
EnableDebugInfo = false
EnableXMLLoadOrderLog = false
