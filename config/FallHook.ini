[InGameTextHook]
; Enable in-game text hooking functionality / 是否启用游戏内文本 Hook 功能
Enable = false
; Log raw unhooked/unmodified text strings to log file / 是否在日志中记录原始未处理的文本字符串
LogRaw = false

[XML]
; LoadOrderMode controls XML file loading priority: / 控制 XML 文件的加载优先级：
; plugin = use active plugin order, then filename descending for files from the same addon. 
; (优先使用当前启用的插件顺序；来自同一 Mod 的文件按文件名降序排列)
; filename = global filename ascending order. Later files overwrite earlier files for the same resolved record slot. 
; (按全局文件名升序排列，较后加载的文件会覆盖前面相同记录槽位的文件)
LoadOrderMode = plugin

[Watchdog]
; Enables load-watch and hook-watch slow/stuck warnings independently of debug trace logging.
; 独立于 Debug 跟踪日志，单独开启加载监控与 Hook 卡顿/慢响应警告
Enable = false

[ActivityWatchdog]
; Aggressive FallHook hook/work activity logging for stutter attribution. Very noisy when enabled.
; 激进的 FallHook 钩子/工作活动日志记录，用于排查微卡顿（Stutter）归因。开启后日志会非常频繁（噪声大）。
Enable = false
; Log start of hook/work execution / 记录 Hook/工作开始执行
LogBegin = true
; Log end of hook/work execution / 记录 Hook/工作结束执行
LogEnd = true
; Log fast call executions / 是否记录快速调用的执行过程
LogFastCalls = true
; Threshold in microseconds (us) to flag a call as slow (500us = 0.5ms) / 判定为慢调用的微秒阈值（500us 即 0.5毫秒）
SlowUs = 500
; Burst detection window size in milliseconds / 突发检测的时间窗口（毫秒）
BurstWindowMs = 250
; Warning threshold for call count within the burst window / 在突发窗口内触发警告的调用次数阈值
BurstCallWarn = 128
; Include work scopes detail in log / 日志中是否包含具体工作作用域信息
IncludeWorkScopes = true
; Include thread call depth in log / 日志中是否包含线程调用深度信息
IncludeThreadDepth = true

[Logging]
; Enable verbose debug logs / 是否开启详细 Debug 调试日志
EnableDebugLog = false
; Enable debug info outputs / 是否开启调试信息输出
EnableDebugInfo = false
; Log XML load order resolution details / 是否在日志中记录 XML 加载顺序的解析细节
EnableXMLLoadOrderLog = false