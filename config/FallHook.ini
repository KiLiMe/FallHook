[InGameTextHook]
; 启用/禁用 游戏内文本钩子（用于实时翻译替换）
; Enable/disable in-game text hook for real-time translation replacement
Enable = false
; 记录未处理的原始文本到日志（调试用）
; Log raw untranslated text to log (debugging only)
LogRaw = false

[XML]
; 翻译文件的加载顺序模式 / Load order mode for translation files
;
; plugin  = 按插件激活顺序排列，同一插件的多个文件按文件名降序排列
;            Use active plugin order, then filename descending for files from the same addon.
; filename = 全局按文件名字典序升序排列。后处理的文件覆盖前面对同一条目的翻译
;            Global filename ascending order. Later files overwrite earlier files for the same resolved record slot.
; layer   = 按文件名的数字前缀排序（如 010_ < 050_ < 999_）；无前缀的文件按 50 处理。
;            后处理的文件覆盖前面的。Overlay/ 文件始终在主目录文件之后应用
;            Sort by filename numeric prefix (e.g. 010_ < 050_ < 999_); files without a prefix use 50.
;            Later files overwrite earlier ones. Overlay/ files always apply after main directory files.
LoadOrderMode = plugin

[Watchdog]
; 启用加载和挂钩过程的慢速/卡死警告（独立于调试追踪日志）
; Enables load-watch and hook-watch slow/stuck warnings independently of debug trace logging
Enable = false

[ActivityWatchdog]
; 激进的 FallHook 挂钩/工作活动日志，用于排查卡顿原因。启用后非常嘈杂
; Aggressive FallHook hook/work activity logging for stutter attribution. Very noisy when enabled
Enable = false
LogBegin = true
LogEnd = true
LogFastCalls = true
SlowUs = 500
BurstWindowMs = 250
BurstCallWarn = 128
IncludeWorkScopes = true
IncludeThreadDepth = true

[Logging]
; 启用调试日志输出 / Enable debug log output
EnableDebugLog = false
; 启用详细信息日志 / Enable detailed debug info
EnableDebugInfo = false
; 启用 XML 加载顺序日志（调试排序问题时启用）
; Enable XML load order logging (enable when debugging sort issues)
EnableXMLLoadOrderLog = false